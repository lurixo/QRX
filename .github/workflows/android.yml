name: Android CI

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 1.2.0)'
        required: true
        default: '1.0.0'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "版本号: $VERSION"
        
        # 计算 versionCode (基于版本号)
        IFS='.' read -r major minor patch <<< "$VERSION"
        VERSION_CODE=$((major * 10000 + minor * 100 + patch))
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "versionCode: $VERSION_CODE"

    - name: Update version in build.gradle.kts
      run: |
        sed -i "s/versionCode = [0-9]*/versionCode = ${{ steps.version.outputs.VERSION_CODE }}/" app/build.gradle.kts
        sed -i "s/versionName = \"[^\"]*\"/versionName = \"${{ steps.version.outputs.VERSION }}\"/" app/build.gradle.kts
        echo "更新后的版本配置:"
        grep -E "versionCode|versionName" app/build.gradle.kts

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 9.3.1

    - name: Decode Keystore
      env:
        RELEASE_KEYSTORE_FILE: ${{ secrets.RELEASE_KEYSTORE_FILE }}
      run: |
        echo "$RELEASE_KEYSTORE_FILE" | base64 -d > app/keystore.jks

    - name: Build Release APK
      env:
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Rename APK
      run: |
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/QRX-v${{ steps.version.outputs.VERSION }}-arm64-v8a.apk

    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view "${{ steps.version.outputs.VERSION }}" &>/dev/null; then
          echo "Release ${{ steps.version.outputs.VERSION }} 已存在，跳过创建"
        else
          gh release create "${{ steps.version.outputs.VERSION }}" \
            --title "QRX v${{ steps.version.outputs.VERSION }}" \
            --generate-notes \
            app/build/outputs/apk/release/QRX-*.apk
        fi
